version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: juan123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: urbancaps-api
    container_name: urbancaps_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: juan123
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./urbanCaps_react
      dockerfile: Dockerfile
    image: urbancaps-frontend
    container_name: urbancaps_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
